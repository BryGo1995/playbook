# Playbook — Shared Defaults
# Project-specific settings go in each repo's playbook.yaml

concurrency:
  max_coding: 1
  max_testing: 1
  max_review: 1

timeouts:
  coding_minutes: 60
  testing_minutes: 30
  review_minutes: 30

guardrails:
  max_files_changed: 10
  max_retry_cycles: 3
  snapshot_on_failure: true
  # Tiered retry for budget-cap failures: how many times to auto-resume after
  # a coding agent hits coding_max_budget_usd before going to ai-blocked. The
  # auto-resume retry is prompted to "resume from snapshot, don't re-explore."
  # After this many budget-cap failures, the orchestrator stops retrying and
  # waits for the user to manually move the issue back to ai-ready.
  max_budget_cap_retries: 1

versioning:
  enabled: true
  auto_create_issues: false
  bootstrap_timeout_minutes: 120
  bootstrap_max_budget_usd: 5.0
  coding_max_budget_usd: 5.0

# Per-role model selection. Pinned full model IDs (not aliases) so benchmark
# baselines stay stable when Anthropic releases new minors. Override any
# subset in a project's playbook.yaml.
models:
  coding: claude-sonnet-4-6
  testing: claude-haiku-4-5
  review: claude-opus-4-7

statuses:
  backlog: "Backlog"
  ready: "ai-ready"
  in_progress: "ai-in-progress"
  testing: "ai-testing"
  review: "ai-review"
  complete: "ai-complete"
  done: "Done"
  blocked: "ai-blocked"
  error: "ai-error"

slack:
  webhook_url: "${SLACK_WEBHOOK_URL}"

learning:
  enabled: true
  project_distiller: true
  agent_craft_distiller: true

metrics:
  enabled: true                    # master switch; set false to disable all metrics
  show_checks: false               # echo structural check + classification summaries to user; default false (for distribution)
  classification_budget_usd: 0.25  # per-version cap for the classification subagent
